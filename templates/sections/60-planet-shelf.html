    <form class="shelf-sort" data-region="shelf-sort" action="/" method="get">
      <label for="planet-sort">Planet shelf order</label>
      <select id="planet-sort" name="sort">
      {%- for name, entry in SORTS.items() %}
        <option value="{{ name }}"{% if sort == name %} selected{% endif %}>{{ entry.label }}</option>
      {%- endfor %}
      </select>
      {% if age %}<input type="hidden" name="age" value="{{ age }}">{% endif %}
      <button type="submit">Apply order</button>
    </form>
    <section class="planet-shelf" data-region="planet-shelf" aria-labelledby="shelf-title">
      <h2 id="shelf-title">The eight planets</h2>
      <p class="shelf-note">{{ SORTS[sort].note }}</p>
      <div class="shelf">
      {% for p in shelf %}
      <article class="planet-card" data-order="{{ p.order }}">
        <h2>{{ p.name }}</h2>
        <p class="order">{{ p.ordinal }} from the Sun</p>
        <p class="label">Diameter</p>
        <p class="diameter">{{ "{:,}".format(p.diameter_km) }} km</p>
        <p class="earths">About {{ p.earths }} Earth{{ "" if p.earths == "1" else "s" }} wide</p>
      </article>
      {% endfor %}
      </div>
    </section>
