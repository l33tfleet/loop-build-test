<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Arcade</title>
  <link rel="stylesheet" href="/static/arcade.css">
</head>
<body>
  <header>
    <h1 data-marker="solar-arcade">Solar Arcade</h1>
    <p class="tagline">A pocket-sized planet playground.</p>
  </header>
  <main>
    <section class="shelf" aria-label="Planet shelf">
      {% for p in planets %}
      <article class="planet-card" data-order="{{ p.order }}">
        <span class="order">#{{ p.order }}</span>
        <h2>{{ p.name }}</h2>
        <p class="label">Diameter</p>
        <p class="diameter">{{ "{:,}".format(p.diameter_km) }} km</p>
      </article>
      {% endfor %}
    </section>
    <p class="source">Data: <a href="{{ source.url }}" rel="noopener">{{ source.name }}</a>, snapshot {{ source.retrieved }}.</p>
  </main>
</body>
</html>
