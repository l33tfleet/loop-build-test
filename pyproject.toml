[project]
name = "loop-build-test"
version = "0.1.0"
description = "Toy app for exercising an autonomous build loop."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
